<style>
/* Layout: a seller's workbench. Fixed tab rail (side on desktop, bottom bar on phones), one working panel at a time. */

  --accent:#ff6a33; --accent-fg:#1a0d06; --accent-soft:#3d2216; --ink:#c9d1f2;
  --good:#4fd18b; --good-soft:#163527; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#ff7a87; --bad-soft:#3d1b21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131b; --panel:#181c27; --sunk:#202534; --line:#2c3244; --fg:#eef0f6; --muted:#9aa1b5;

  --good:#4fd18b; --good-soft:#163527; --warn:#f0b44c; --warn-soft:#3a2c12; --bad:#ff7a87; --bad-soft:#3d1b21; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;background:var(--ink);color:#fff;padding:20px 12px;display:flex;flex-direction:column;gap:4px}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rail{background:#0b0e15;border-right:1px solid var(--line)}}

.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:#fff}
.brand svg{flex:none}
.tab{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:#c8cde0;text-align:left;cursor:pointer;font-weight:500}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab[aria-current="true"]{background:var(--accent);color:#fff}

.main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.check.done span{color:var(--muted);text-decoration:line-through}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}

.item{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--panel);min-width:0}

.score{font-family:var(--f-display);font-weight:800;font-size:1.4rem}

@media (max-width:820px){

  .tab{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 8px;width:auto;min-width:62px;align-items:center}
  .tab .n{display:none}
  .grid.two{grid-template-columns:1fr}

}
@media (prefers-reduced-motion:no-preference){.btn,.tab{transition:background .15s,border-color .15s}}

<script>
"use strict";
/* ============ helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const money = n => (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2);
const pct = n => (isFinite(n) ? n.toFixed(1) : "0.0") + "%";
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.floor((new Date(b + "T12:00") - new Date(a + "T12:00")) / 864e5);
const words = s => (String(s || "").trim().match(/\S+/g) || []).length;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast("Copied"); } catch (_) { toast("Select the text and copy it manually"); } ta.remove(); }
}

/* ============ guide data ============ */
const PLAN = [
  { week: 1, name: "Set up and pick a product", tasks: [
    ["w1a", "Create the TikTok Business account and apply for the shop with matching documents", "settings"],
    ["w1b", "Research 10 products with the free tools; score them on the checklist; pick the top 3", "products"],
    ["w1c", "Order samples of the top 2", "products"],
    ["w1d", "Post 1 video a day in your niche (no product yet) to warm up the account", "content"]] },
  { week: 2, name: "List and start posting", tasks: [
    ["w2a", "Choose the winning sample; order 30–100 units", "products"],
    ["w2b", "Make listing photos and copy with the AI tools; submit the listing", "listings"],
    ["w2c", "Batch-film and edit 14 videos with the weekly workflow", "content"],
    ["w2d", "Post 2 videos a day with the product link", "content"]] },
  { week: 3, name: "Add creators", tasks: [
    ["w3a", "Open an affiliate plan at 15–20% and invite 20 creators with sample offers", "creators"],
    ["w3b", "Make reply videos from the best comments", "content"],
    ["w3c", "Remake your top 2 videos with 5 new hooks each", "content"]] },
  { week: 4, name: "Double down", tasks: [
    ["w4a", "Cut formats with under-average 3-second hold; keep the winners", "content"],
    ["w4b", "Reorder stock if sell-through is on pace; add a second product or color variation", "products"],
    ["w4c", "Review fees and real profit per unit from your settlement statements", "metrics"]] }
];
const SETUP = [
  ["s1", "Create a TikTok account for the brand and switch it to a Business account"],
  ["s2", "Register at TikTok Shop Seller Center with a phone and email not used on another shop"],
  ["s3", "Choose Individual or Business and upload matching ID, SSN/ITIN or EIN, W-9 and bank account in the same name"],
  ["s4", "Add warehouse and return addresses; pick seller shipping or Fulfilled by TikTok"],
  ["s5", "Link the TikTok account to the shop as its Official Shop account"],
  ["s6", "Double-check: names and addresses match on every document; IRS letter uploaded as the real PDF, not a screenshot"]
];
const PRODUCT_CHECKS = [
  ["wow", "Visual wow", "The result shows on camera in 3 seconds"],
  ["price", "Price $15–$50", "Impulse buy with room for fees and commission"],
  ["landed", "Landed cost under 30%", "Product plus shipping to you"],
  ["light", "Light and unbreakable", "Cheap to ship, few damage returns"],
  ["allowed", "Not restricted", "No supplements, medical-claim cosmetics, weapons or approval-gated categories"],
  ["demand", "Proven demand, not saturated", "Several videos selling it, not hundreds of identical listings"]
];
const FORMATS = [
  ["problem", "Problem → solution", "Show the annoying problem, then the product fixing it", "10–20s"],
  ["tried", "“I tried…” honest review", "Unbox, use it, say one real downside and why you still like it", "20–45s"],
  ["demo", "Satisfying demo", "No talking; close-up of the product working, ASMR sound", "7–15s"],
  ["reply", "Reply to a comment", "Use reply-with-video to answer a real question or objection", "15–30s"],
  ["three", "3 reasons / 3 uses", "Fast list with on-screen text, one use per cut", "15–25s"]
];
const HOOK_FORMULAS = [
  "If you [have this problem], stop scrolling.",
  "I didn't think this would work, but…",
  "The $[price] thing that fixed my [problem].",
  "Things I'd buy again from TikTok Shop: #1…",
  "(Start mid-action: first frame is the product already working)"
];
const VIDEO_STAGES = ["idea", "filmed", "edited", "scheduled", "posted"];
const CREATOR_STAGES = ["found", "invited", "sample sent", "posted", "selling", "passed"];
const TARGETS = [
  { k: "hold3", label: "3-second hold rate", unit: "%", where: "TikTok Studio analytics", target: "Over 50%", ok: v => v >= 50, near: v => v >= 40 },
  { k: "ctr", label: "Product link click-through", unit: "%", where: "Seller Center / video analytics", target: "1–3% of viewers", ok: v => v >= 1, near: v => v >= 0.6 },
  { k: "conv", label: "Conversion (orders ÷ product page views)", unit: "%", where: "Seller Center", target: "2–5%", ok: v => v >= 2, near: v => v >= 1.2 },
  { k: "profit", label: "Profit per order after all fees", unit: "$", where: "Settlement statement", target: "Positive at the full referral rate", ok: v => v > 0, near: v => v > -1 },
  { k: "late", label: "Late dispatch rate", unit: "%", where: "Account Health", target: "Under 10%, aim for 0%", ok: v => v === 0, near: v => v < 10, lowerBetter: true },
  { k: "aff", label: "Affiliate videos posted", unit: "", where: "Affiliate dashboard", target: "5+ in the first month", ok: v => v >= 5, near: v => v >= 2 }
];
const TIERS = { Beginner: 50, Standard: 100, Premium: 200, Pro: Infinity };

/* ============ compliance scanner (rules from the guide) ============ */
const RULES = [
  { re: /https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|shop|store|co)\b/i, sev: "bad", msg: "Off-platform link or web address. Links and URLs get content removed." },
  { re: /\b(amazon|walmart|etsy|shopify|ebay|temu|aliexpress|target\.com|my website|link in (my )?bio)\b/i, sev: "bad", msg: "Mentions another marketplace or sends buyers off TikTok." },
  { re: /\bqr[ -]?code\b/i, sev: "bad", msg: "QR codes count as off-platform redirection." },
  { re: /\bdupes?\b/i, sev: "bad", msg: "“Dupe” claims are prohibited." },
  { re: /\b(best[- ]?sell(er|ing)|#1 (best|rated|selling)|number one (selling|rated)|top[- ]rated)\b/i, sev: "bad", msg: "“Best seller” style claims are not allowed in listings and are risky in videos." },
  { re: /\b(cures?|cured|heals?|treats?|treatment for|diagnos\w*|prevents? (disease|illness|cancer|infection)|medical[- ]grade|clinically (proven|tested)|fda[- ]approved|doctor recommended)\b/i, sev: "bad", msg: "Health or medical claim. These are restricted and often category-gated." },
  { re: /\b(weight[- ]?loss|lose (\d+ )?(lbs?|pounds|weight)|burns? fat|fat[- ]burn\w*|slimming|detox|anti[- ]?aging|reverses? aging|boosts? (immunity|metabolism))\b/i, sev: "bad", msg: "Weight-loss, detox or anti-aging claim. Restricted." },
  { re: /\b(pain relief|relieves? pain|anxiety|depression|insomnia|acne cure|eczema|arthritis)\b/i, sev: "bad", msg: "Condition claim. Only allowed with approval and proof." },
  { re: /\bbefore (and|&|\/|vs\.?) after\b/i, sev: "warn", msg: "Before/after: only post results you can prove with real footage." },
  { re: /\b(guarantee[ds]?|100% (safe|effective|natural)|miracle|instant results?|never fails|works for everyone|risk[- ]free)\b/i, sev: "warn", msg: "Absolute claim. Soften it or make sure you can back it up." },
  { re: /\b(my customers (all )?say|thousands of (happy )?customers|everyone (is )?(loves|buying))\b/i, sev: "warn", msg: "Testimonial-style claim. Only use real, verifiable customer experiences." },
  { re: /\b(free shipping forever|lowest price (ever|anywhere)|cheapest (anywhere|on tiktok))\b/i, sev: "warn", msg: "Price claim that is hard to prove." }
];
function scanText(text) {
  const out = []; const t = String(text || "");
  if (!t.trim()) return out;
  for (const r of RULES) { const m = t.match(r.re); if (m) out.push({ sev: r.sev, msg: r.msg, hit: m[0] }); }
  const caps = (t.match(/\b[A-Z]{4,}\b/g) || []).filter(w => !["USB", "LED", "HDMI", "USA", "ASMR", "BPA"].includes(w));
  if (caps.length >= 3) out.push({ sev: "warn", msg: "Lots of ALL CAPS words. Listings reject all-caps titles.", hit: caps.slice(0, 3).join(", ") });
  return out;
}

/* ============ state + storage ============ */
const LS = "ocs.v1", LS_KEY = "ocs.gemini", LS_TAB = "ocs.tab";
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const KEYS = ["settings", "plan", "products", "hooks", "videos", "listings", "creators", "lives", "metrics", "replies"];
function blank() {
  return { settings: { aiMode: "auto", geminiModel: "gemini-2.5-flash", referralPct: 8, commissionPct: 15, startDate: "", brand: "", niche: "", tier: "Beginner", ahr: 200, theme: "" },
    plan: {}, products: [], hooks: [], videos: [], listings: [], creators: [], lives: [], metrics: [], replies: [], meta: { at: 0 } };
}
function example() {
  const S = blank(); const p = uid();
  S.products.push({ id: p, example: true, name: "Example: Collapsible sink caddy", price: 19.99, landed: 4.8, shipping: 4.5, status: "testing",
    checks: { wow: true, price: true, landed: true, light: true, allowed: true, demand: false }, buyer: "renters with tiny kitchens", problem: "wet sponges and clutter around the sink",
    specs: "Silicone, folds flat, drains into sink, fits sponges and brushes, 9 x 4 in", research: { comments: "", reviews: "", insights: "" }, angles: "", suppliers: [

function listingChecks(L) {
  const t = String(L.title || ""), bl = String(L.bullets || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean), all = t + "\n" + bl.join("\n");
  const c = [];
  c.push([t.length >= 25 && t.length <= 200, `Title length ${t.length} (needs 25–200)`]);
  c.push([!(t.length > 8 && t === t.toUpperCase() && /[A-Z]/.test(t)) && (t.match(/\b[A-Z]{4,}\b/g) || []).length < 2, "Title isn't in all caps"]);
  c.push([!/best[- ]?sell|#1|top[- ]rated/i.test(t), "No “Best Seller”, #1 or top-rated in the title"]);
  c.push([!/https?:|www\.|\.com\b/i.test(all), "No URLs or off-platform links"]);
  c.push([words(bl.join(" ")) >= 30, `Description is ${words(bl.join(" "))} words (needs 30+)`]);
  c.push([bl.length >= 3 && bl.length <= 5, `${bl.length} bullets (needs 3–5)`]);
  const imgs = L.imgCount || 0;
  c.push([imgs >= 5 && imgs <= 9 && L.imgOk, imgs ? `${imgs} photos checked${L.imgOk ? ", all pass" : ", some need fixes"}` : "5–9 square photos checked"]);

async function checkImageFiles(files) {
  const L = S.listings.find(l => l.id === UI.listing) || S.listings[0]; if (!L) return;
  const rows = []; let ok = true; let i = 0;
  for (const f of files) {
    i++;
    const r = await new Promise(res => { const url = URL.createObjectURL(f); const im = new Image(); im.onload = () => { const c = document.createElement("canvas"); const w = im.naturalWidth, h = im.naturalHeight; c.width = 60; c.height = 60; const x = c.getContext("2d"); x.drawImage(im, 0, 0, 60, 60); const d = x.getImageData(0, 0, 60, 60).data; let white = 0, n = 0;
      for (let y = 0; y < 60; y++) for (let xx = 0; xx < 60; xx++) { if (y > 3 && y < 56 && xx > 3 && xx < 56) continue; const k = (y * 60 + xx) * 4; n++; if (d[k] > 235 && d[k + 1] > 235 && d[k + 2] > 235) white++; }
      URL.revokeObjectURL(url); res({ w, h, white: white / n }); }; im.onerror = () => res(null); im.src = url; });
    if (!r) { rows.push(`<div class="alert bad"><div class="grow">${esc(f.name)}: couldn't read this image.</div></div>`); ok = false; continue; }
    const probs = []; if (r.w < 600 || r.h < 600) probs.push(`only ${r.w}×${r.h} px (needs 600+)`); if (Math.abs(r.w - r.h) > Math.max(r.w, r.h) * 0.02) probs.push(`not square (${r.w}×${r.h})`);
    if (i === 1 && r.white < 0.85) probs.push("main image edges aren't white; use a background remover");
    if (probs.length) ok = false;
    rows.push(`<div class="alert ${probs.length ? "bad" : "good"}"><div class="grow"><b>${i === 1 ? "Main: " : ""}${esc(f.name)}</b> ${probs.length ? esc(probs.join("; ")) : `${r.w}×${r.h} ✓`}</div></div>`);
  }
  if (files.length < 5 || files.length > 9) { rows.unshift(`<div class="alert warn"><div class="grow">You picked ${files.length} photos. Use 5–9; the first one you pick is treated as the main image.</div></div>`); }
  L.imgCount = files.length; L.imgOk = ok; L.imgReport = rows.join("") + `<p class="small muted">Free fixes: Adobe Express or CapCut background remover; resize to square. Also check by eye: no text, logos or watermarks on the main image.</p>`;
  save(["listings"]); render();
}

        const hooks = parseList(hpart).slice(0, 25); hooks.forEach(h => S.hooks.push({ id: uid(), productId: pp.id, text: h.text, style: h.style || "", used: false }));
        const scriptsText = rest.length ? "SCRIPT 1\n" + rest.join("") : "";
        const blocks = scriptsText ? splitBlocks(scriptsText, "SCRIPT") : [];
        blocks.forEach(b => S.videos.push(newVideo(pp.id, field(b, "HOOK"), fmtKey(field(b, "FORMAT")), b.replace(/^.*(FORMAT|HOOK)\s*:.*$/gim, "").trim())));
        if (!blocks.length && !hooks.length) S.videos.push(newVideo(pp.id, "", "", t.trim()));
        UI.contentMode = "board"; TAB = "content"; toast(`Added ${hooks.length} hooks and ${blocks.length} video drafts`);
      });
    });
  },
  newScript() {
    const p = prod(UI.product) || S.products[0]; if (!p) { toast("Add a product first"); return go("products"); }
    openForm("Write a script", `<div class="fields"><label class="f">Product${productSelect('id="nsProd"', p.id)}</label><label class="f">Format<select id="nsFmt">${FORMATS.map(f => opt(f[0], "problem", f[1])).join("")}</select></label></div>
      <label class="f">Hook (optional)<input type="text" id="nsHook" placeholder="Leave blank and AI writes one"></label>`, "Write script", () => {
      const v = newVideo($("#nsProd").value || p.id, $("#nsHook").value.trim(), $("#nsFmt").value, ""); S.videos.push(v); UI.video = v.id; A.scriptFor(v.id);
    });
  },
  scriptFor(id) {
    const v = S.videos.find(x => x.id === id), p = prod(v.productId), f = FORMATS.find(x => x[0] === v.format) || FORMATS[0];
    ai(`${productCtx(p)}\n\n${RULES_FOR_AI}\n\nWrite a TikTok script for this product in the "${f[1]}" format (${f[2]}, ${f[3]}). Structure: hook (0–2s), problem (2–5s), product solves it on camera (5–15s), call to action to tap the orange cart (15–20s); adjust timings to the format. Include shot directions in [brackets] and on-screen text in {braces}.${v.hook ? `\nUse this exact hook: "${v.hook}"` : "\nStart with a line 'HOOK: <hook under 10 words>'."}`, "Writing script", t => {
      const h = field(t, "HOOK"); if (h && !v.hook) v.hook = h.replace(/^["“]|["”]$/g, ""); v.script = t.replace(/^\s*\**HOOK\**\s*:.*$/im, "").trim(); UI.video = v.id; TAB = "content"; UI.contentMode = "board"; });
  },
  caption(id) {
    const v = S.videos.find(x => x.id === id), p = prod(v.productId);
    ai(`${productCtx(p)}\n\n${RULES_FOR_AI}\n\nWrite one TikTok caption for this video. Under 150 characters plus 3–5 relevant hashtags (include #tiktokshop). Only output the caption.\nHook: ${v.hook}\nScript:\n${(v.script || "").slice(0, 2000)}`, "Writing caption", t => { v.caption = t.trim().replace(/^["“]|["”]$/g, ""); });
  },
  captions() {
    const need = S.videos.filter(v => !v.caption && v.status !== "posted" && (v.hook || v.script));
    if (!need.length) { toast("Every video already has a caption"); return go("content"); }
    const list = need.slice(0, 14);
    ai(`${RULES_FOR_AI}\n\nWrite one TikTok caption for each video below: under 150 characters plus 3–5 relevant hashtags (include #tiktokshop). Answer with lines "CAPTION n: <caption>" in the same order.\n\n${list.map((v, i) => `VIDEO ${i + 1} (product: ${pname(v.productId)}): ${v.hook}\n${(v.script || "").slice(0, 400)}`).join("\n\n")}`, "Writing captions", t => {
      let n = 0; list.forEach((v, i) => { const m = t.match(new RegExp("CAPTION\\s*" + (i + 1) + "\\s*:\\s*(.+)", "i")); if (m) { v.caption = m[1].trim(); n++; } });
      TAB = "content"; toast(`Captioned ${n} videos. Schedule them in TikTok Studio.`); });
  },
  reply() {
    const p = prod(UI.product) || S.products.find(x => !x.example) || S.products[0]; if (!p) { toast("Add a product first"); return go("products"); }
    openForm("Turn a comment into a video", `<label class="f">Product${productSelect('id="rpProd"', p.id)}</label><label class="f">Paste a real comment, question or objection<textarea id="rpText"></textarea></label>`, "Write reply video", () => {
      const c = $("#rpText").value.trim(); if (!c) return toast("Paste a comment first"); const pp = prod($("#rpProd").value) || p;
      ai(`${productCtx(pp)}\n\n${RULES_FOR_AI}\n\nA viewer commented: "${c}"\nWrite a 15–30 second reply-with-video TikTok script that answers it honestly by showing the real product. Start with "HOOK: <first line>", then the script with shot directions in [brackets], ending with a call to tap the orange cart. Then write "REPLY: <a short friendly text reply to the comment>".`, "Writing reply video", t => {
        const v = newVideo(pp.id, field(t, "HOOK"), "reply", t.replace(/^\s*\**(HOOK|REPLY)\**\s*:.*$/gim, "").trim()); v.notes = field(t, "REPLY"); v.script = (v.notes ? "Text reply: " + v.notes + "\n\n" : "") + v.script; S.videos.push(v); UI.video = v.id; TAB = "content"; UI.contentMode = "board"; });
    });
  },
  repurpose(id) {
    const v = S.videos.find(x => x.id === id), p = prod(v.productId);
    ai(`${productCtx(p)}\n\n${RULES_FOR_AI}\n\nHere is a TikTok that got ${num(v.views).toLocaleString()} views (${num(v.hold3)}% watched past 3 seconds).\nHOOK: ${v.hook}\nSCRIPT:\n${v.script || "(same footage, not written down)"}\n\nWrite 5 variations with different hooks and the same middle. For each, write "VARIATION n", "HOOK: <new hook under 10 words>", then the opening 2–3 seconds with shot directions in [brackets]. Keep the rest identical.`, "Writing 5 variations", t => {
      const blocks = splitBlocks(t, "VARIATION"); let n = 0;
      blocks.forEach(b => { const h = field(b, "HOOK"); if (!h) return; n++; S.videos.push(newVideo(v.productId, h.replace(/^["“]|["”]$/g, ""), v.format, b.replace(/^.*HOOK\s*:.*$/im, "").trim() + (v.script ? "\n\n--- Same middle as original ---\n" + v.script : ""))); });
      v.repurposed = true; TAB = "content"; UI.contentMode = "board"; toast(`Added ${n} variations to your board`); });
  },
  hooks30() {
    const p = prod($("#hookProd").value); if (!p) return toast("Pick a product first");
    ai(`I sell ${p.name} for $${num(p.price).toFixed(2)} to ${p.buyer || "people who need it"}. Their biggest problem is ${p.problem || "(infer it from the product)"}. ${p.specs ? "Details: " + p.specs + "." : ""}\nWrite 30 TikTok hooks under 10 words: 10 problem-first, 10 curiosity, 10 'I tried…' style. Put each group under its own heading (Problem-first, Curiosity, I tried) as a numbered list. No false claims. ${RULES_FOR_AI}`, "Writing 30 hooks", t => {
      const hs = parseList(t); hs.forEach(h => S.hooks.push({ id: uid(), productId: p.id, text: h.text, style: h.style, used: false })); toast(`Added ${hs.length} hooks`); });
  },
  addHook() { openForm("Add a hook", `<label class="f">Hook<input type="text" id="ahText"></label>`, "Add", () => { const t = $("#ahText").value.trim(); if (t) { S.hooks.push({ id: uid(), productId: UI.product || "", text: t, style: "", used: false }); save(["hooks"]); render(); } }); },
  addHookText(_, el) { S.hooks.push({ id: uid(), productId: UI.product || "", text: el.dataset.text, style: "formula", used: false }); save(["hooks"]); render(); toast("Added. Fill in the brackets."); },
  delHook(id) { S.hooks = S.hooks.filter(h => h.id !== id); save(["hooks"]); render(); },
  hookToVideo(id) { const h = S.hooks.find(x => x.id === id); h.used = true; const v = newVideo(h.productId || (S.products[0] || {}).id || "", h.text, "", ""); S.videos.push(v); UI.video = v.id; UI.contentMode = "board"; save(); render(); },
  addVideo() { const v = newVideo(UI.product || (S.products[0] || {}).id || "", "", "", ""); S.videos.push(v); UI.video = v.id; save(["videos"]); render(); },
  pickVideo(id) { UI.video = id; render(); window.scrollTo(0, 0); },
  closeVideo() { UI.video = null; render(); },
  delVideo(id) { if (!confirmTwice("delVideo" + id)) return; S.videos = S.videos.filter(v => v.id !== id); UI.video = null; save(["videos"]); render(); },
  /* listing */
  addListing() { const l = { id: uid(), productId: UI.product || (S.products.find(p => !p.example) || S.products[0] || {}).id || "", title: "", bullets: "" }; S.listings.push(l); UI.listing = l.id; save(["listings"]); render(); },
  pickListing(id) { UI.listing = id; render(); },
  delListing(id) { if (!confirmTwice("delListing" + id)) return; S.listings = S.listings.filter(l => l.id !== id); UI.listing = null; save(["listings"]); render(); },
  writeListing(id) {
    const L = S.listings.find(l => l.id === id), p = prod(L.productId); if (!p) return toast("Pick the product first");
    ai(`${productCtx(p)}\n\n${RULES_FOR_AI}\n\nWrite a TikTok Shop listing. Title: 25–200 characters, brand + product type + key details, no "best seller", no all caps, no seller name or URLs. Then a 5-bullet description of at least 30 words total, plain facts only, include materials and dimensions if given, and answer the buyer's main worries.\nAnswer exactly in this format:\nTITLE: <title>\nBULLETS:\n- <bullet>\n- <bullet>\n- <bullet>\n- <bullet>\n- <bullet>`, "Writing listing", t => {
      L.title = (field(t, "TITLE") || "").replace(/^["“]|["”]$/g, ""); const after = t.split(/BULLETS\s*:?/i)[1] || t; L.bullets = after.split(/\r?\n/).filter(l => /^\s*(?:[-*•]\s|\d+[.)]\s?)/.test(l)).map(cleanLine).join("\n"); UI.listing = L.id; });
  },
  checkImages() { const f = $("#fileImages"); f.value = ""; f.click(); },
  /* creators */
  addCreator() { S.creators.push({ id: uid(), handle: "@", followers: "", niche: S.settings.niche || "", status: "found", commission: S.settings.commissionPct, sentOn: "", videos: 0, gmv: 0, invite: "" }); save(["creators"]); render(); },
  delCreator(id) { if (!confirmTwice("delCreator" + id)) return; S.creators = S.creators.filter(c => c.id !== id); save(["creators"]); render(); },
  invite(id) {
    const c = S.creators.find(x => x.id === id), p = S.products.find(x => !x.example && x.status !== "dropped") || S.products[0];
    const follow = c.status === "sample sent" && c.sentOn && daysBetween(c.sentOn, todayISO()) >= 7;
    ai(`${productCtx(p)}\n\nWrite a short, personal TikTok DM (under 80 words) ${follow ? `following up with creator ${c.handle} who received a free sample ${daysBetween(c.sentOn, todayISO())} days ago but hasn't posted yet. Friendly, no pressure, offer help with talking points.` : `inviting creator ${c.handle} (${c.niche || "same niche"}, ${num(c.followers).toLocaleString()} followers) to promote this product through my TikTok Shop affiliate plan at ${num(c.commission)}% commission with a free sample.`} Sound like a real small-business owner, not a template. Only output the message.`, follow ? "Writing follow-up" : "Writing invite", t => { c.invite = t.trim(); if (c.status === "found") c.status = "invited"; });
  },
  /* live */
  liveplan() {
    const p = prod($("#liveProd").value); if (!p) return toast("Pick a product first");
    const len = num($("#liveLen").value) || 45, offer = $("#liveOffer").value.trim();
    ai(`${productCtx(p)}\n\n${RULES_FOR_AI}\n\nBuild a run-of-show for a ${len}-minute TikTok Shop LIVE. Include: 1) a minute-by-minute outline that demos the product continuously and reminds hosts to pin the product and greet commenters by name; 2) 5 demo segments; 3) 10 common objections with short honest answers; 4) a reason to buy now${offer ? ` using this offer: ${offer}` : " using a time-limited discount"}. Use clear headings.`, "Writing run-of-show", t => { S.lives.push({ id: uid(), productId: p.id, date: todayISO(), plan: t.trim() }); });
  },
  delLive(id) { S.lives = S.lives.filter(l => l.id !== id); save(["lives"]); render(); },
  /* numbers */
  addWeek() {
    const wk = new Date(); wk.setDate(wk.getDate() - ((wk.getDay() + 6) % 7)); const w = wk.toISOString().slice(0, 10);
    const vs = videoStats(); const rec = vs.ps.filter(v => v.date && daysBetween(v.date, todayISO()) < 7 && !v.example);
    const avg = (k) => { const a = rec.filter(v => num(v[k]) > 0); return a.length ? +(a.reduce((s, v) => s + num(v[k]), 0) / a.length).toFixed(1) : ""; };
    const live = S.products.find(p => !p.example && ["testing", "winner"].includes(p.status));
    S.metrics.push({ id: uid(), week: w, hold3: avg("hold3"), ctr: avg("ctr"), conv: "", profit: live ? +econ(live).organic.toFixed(2) : "", late: "", aff: S.creators.filter(c => !c.example).reduce((s, c) => s + num(c.videos), 0) || "" });
    save(["metrics"]); render(); toast("Filled in what the studio knows. Add the rest from Seller Center.");
  },
  delWeek(id) { S.metrics = S.metrics.filter(m => m.id !== id); save(["metrics"]); render(); },
  /* check */
  aiCheck() {
    const t = $("#chkText").value.trim(); if (!t) return toast("Paste text first");
    ai(`You review TikTok Shop content for US policy problems before posting. Flag anything that could be removed: unprovable or absolute claims, health/medical/weight-loss claims, before/after claims, fake testimonials, off-platform links or marketplace mentions, 'dupe', 'best seller', all caps titles, and missing AI or commercial disclosures. For each problem, quote it and give a safer rewrite. If it's fine, say so in one line.\n\nTEXT:\n${t.slice(0, 8000)}`, "Reviewing", r => { UI.chk = t; openForm("AI second opinion", `<div class="out">${esc(r)}</div>`, "Done", () => {}); });
  },
  /* settings */
  saveKey() { lsSet(LS_KEY, $("#set-key").value.trim()); render(); toast("Key saved on this device"); },
  clearKey() { try { localStorage.removeItem(LS_KEY); } catch (e) {} render(); },
  async export() {
    const data = JSON.stringify(Object.assign({}, S, { exportedAt: new Date().toISOString() }), null, 1), name = `orange-cart-backup-${todayISO()}.json`;
    try { const dl = window.claude && window.claude.use ? await claude.use("downloads") : null; if (dl) { await dl.save({ filename: name, data }); toast("Backup saved"); return; } } catch (e) { if (e && e.code === "cancelled") return; }
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    catch (e) {}
    openForm("Backup", `<p class="small muted">If no file downloaded, copy this text and save it in a note.</p><textarea readonly style="min-height:220px">${esc(data)}</textarea>`, "Copy backup text", () => copy(data));
  },
  import() { const f = $("#fileImport"); f.value = ""; f.click(); },
  resetAsk() { $("#resetConfirm").innerHTML = `<button class="btn sm" data-act="resetYes" style="color:var(--bad)">Yes, erase all my data</button>`; },
  resetYes() { S = normalize(blank()); save(); render(); toast("Erased"); }
};
function newVideo(productId, hook, format, script) { return { id: uid(), productId, hook: hook || "", format: format || "", script: script || "", caption: "", status: "idea", date: "", views: "", hold3: "", ctr: "", orders: "", flags: { cart: false, commercial: false, aiVoice: false, aiVisual: false, aiLabel: false } }; }
function fmtKey(s) { s = String(s || "").toLowerCase(); return s.includes("tried") ? "tried" : s.includes("demo") || s.includes("satisf") ? "demo" : s.includes("reply") || s.includes("comment") ? "reply" : s.includes("reason") || s.includes("uses") ? "three" : s ? "problem" : ""; }
const pending = {};
function confirmTwice(k) { if (pending[k] && Date.now() - pending[k] < 4000) { delete pending[k]; return true; } pending[k] = Date.now(); toast("Click again to confirm"); return false; }
function openForm(title, html, cta, onGo) {
  const dlg = $("#dlg"), body = $("#dlgBody");
  body.innerHTML = `<h2>${esc(title)}</h2>${html}<div class="row"><button class="btn primary" id="fGo">${esc(cta)}</button><button class="btn ghost" id="fCancel">Cancel</button></div>`;
  $("#fCancel").onclick = () => dlg.close();
  $("#fGo").onclick = () => { dlg.close(); onGo(); };
  if (!dlg.open) dlg.showModal();
}

/* ============ events ============ */
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) { o[ks[i]] = o[ks[i]] || {}; o = o[ks[i]]; } o[ks[ks.length - 1]] = val; }
function bindValue(el) {
  const [col, id, path] = el.dataset.bind.split(":");
  const target = col === "settings" ? S.settings : (S[col] || []).find(x => x.id === id); if (!target) return null;
  const val = el.type === "checkbox" ? el.checked : el.type === "number" ? (el.value === "" ? "" : num(el.value)) : el.value;
  setPath(target, path, val); return { col, target };
}
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind) {
    const r = bindValue(el); if (!r) return; save([r.col]);
    if (TAB === "products" && /price|landed|shipping/.test(el.dataset.bind)) { const p = r.target; const box = $("#econ"); if (box) box.innerHTML = "<h2>Margin check</h2>" + econHTML(p); }
    if (el.dataset.live === "listing") liveListing();
    if (TAB === "content" && /:(hook|script|caption)$/.test(el.dataset.bind)) { const box = $("#vIssues"); if (box) { const iss = videoIssues(r.target); box.innerHTML = iss.length ? issuesHTML(iss) : `<div class="alert good"><div class="grow">Ready to post.</div></div>`; } }
  }
  if (el.dataset.sup) { const [pid, sid, f] = el.dataset.sup.split(":"); const s = prod(pid).suppliers.find(x => x.id === sid); s[f] = el.type === "number" ? (el.value === "" ? "" : num(el.value)) : el.value; save(["products"]); }
  if (el.dataset.live === "check" || (TAB === "check" && el.type === "checkbox")) liveCheck();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.bind) {
    const r = bindValue(el); if (!r) return; save([r.col]);
    if (el.dataset.bind === "settings::aiMode") toast("AI: " + AI.label());
    setTimeout(render, 0); return;
  }
  if (el.dataset.sup) { setTimeout(render, 0); return; }
  if (el.dataset.plan) { S.plan[el.dataset.plan] = el.checked; save(["plan"]); render(); return; }
  if (el.dataset.check) { const [pid, k] = el.dataset.check.split(":"); const p = prod(pid); p.checks = p.checks || {}; p.checks[k] = el.checked; save(["products"]); render(); return; }
  if (el.dataset.flag) { const [vid, k] = el.dataset.flag.split(":"); const v = S.videos.find(x => x.id === vid); v.flags = v.flags || {}; v.flags[k] = el.checked; save(["videos"]); render(); return; }
  if (el.dataset.hookused) { const h = S.hooks.find(x => x.id === el.dataset.hookused); h.used = el.checked; save(["hooks"]); render(); return; }
  if (el.id === "fileImport" && el.files[0]) {
    const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.products)) throw 0; S = normalize(d); save(); render(); toast("Backup imported"); } catch (_) { toast("That file isn't an Orange Cart backup"); } }; r.readAsText(el.files[0]);
  }
  if (el.id === "fileImages" && el.files.length) checkImageFiles([...el.files]);
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-mode],[data-copy],[data-copy-field]"); if (!t) return;
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.mode) { UI.contentMode = t.dataset.mode; return render(); }
  if (t.dataset.copy !== undefined) return copy(t.dataset.copy);
  if (t.dataset.copyField) { const f = document.getElementById(t.dataset.copyField); return copy(f ? f.value : ""); }
  const fn = A[t.dataset.act]; if (fn) fn(t.dataset.id, t);
});
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (TABS.some(t => t[0] === h)) go(h); });

render();
AI.init();
Cloud.init();
</script>
